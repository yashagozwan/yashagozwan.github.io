  <!-- Card Rendering Logic -->
  <script>
    (function () {
      const grid = document.getElementById("ideas-grid");
      const filterContainer = document.getElementById("category-filters");
      const collection = window.IDEAS_COLLECTION || [];

      if (!collection.length) {
        grid.innerHTML = `
            <div class="col-span-full py-16 text-center text-stone-500 bg-white rounded-3xl border border-stone-200/60 p-8">
              <p class="font-serif italic text-lg text-stone-700 mb-2">The archive is being prepared.</p>
              <p class="text-sm text-stone-500">New reflections and reading notes will be added soon.</p>
            </div>
          `;
        return;
      }

      // Extract categories for filter
      const categories = ["All", ...new Set(collection.map((item) => item.category).filter(Boolean))];
      let activeCategory = "All";

      function renderFilters() {
        if (categories.length <= 2) {
          filterContainer.style.display = "none";
          return;
        }
        filterContainer.innerHTML = categories
          .map((cat) => {
            const isActive = cat === activeCategory;
            return `
                <button
                  type="button"
                  data-category="${cat}"
                  class="filter-btn px-4 py-2 rounded-full text-xs font-semibold tracking-wide transition-all ${isActive
                ? "bg-gray-900 text-white shadow-sm"
                : "bg-white text-stone-600 hover:bg-stone-100 border border-stone-200/80"
              }"
                >
                  ${cat}
                </button>
              `;
          })
          .join("");

        filterContainer.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeCategory = btn.dataset.category;
            renderFilters();
            renderCards();
          });
        });
      }

      function renderCards() {
        const filtered =
          activeCategory === "All"
            ? collection
            : collection.filter((item) => item.category === activeCategory);

        grid.innerHTML = filtered
          .map((doc) => {
            const tagsHtml = Array.isArray(doc.tags)
              ? doc.tags
                .map(
                  (tag) =>
                    `<span class="px-2.5 py-1 bg-stone-100 text-stone-600 rounded-full text-[11px] font-medium tracking-wide">${tag}</span>`
                )
                .join("")
              : "";

            return `
                <article class="group bg-white rounded-3xl border border-stone-200/80 overflow-hidden shadow-sm hover:shadow-xl hover:border-stone-300 transition-all duration-500 flex flex-col">
                  
                  <!-- Cover Image -->
                  <div class="relative aspect-[16/10] overflow-hidden bg-stone-100">
                    <img
                      src="${doc.cover}"
                      alt="${doc.title} - Cover Artwork"
                      loading="lazy"
                      class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-[1.02]"
                    />
                    <div class="absolute top-4 left-4">
                      <span class="px-3 py-1 bg-white/90 backdrop-blur-md rounded-full text-[11px] font-semibold tracking-wider uppercase text-stone-800 shadow-sm border border-stone-200/50">
                        ${doc.category || "Reflection"}
                      </span>
                    </div>
                  </div>

                  <!-- Document Content -->
                  <div class="p-7 sm:p-8 flex flex-col flex-grow justify-between space-y-6">
                    <div class="space-y-3">
                      <div class="flex items-center justify-between gap-2 text-xs text-stone-400">
                        <span>${doc.date || "Reflection"}</span>
                        <span>PDF Document</span>
                      </div>

                      <h2 class="font-serif italic text-2xl sm:text-3xl text-stone-900 font-medium leading-snug">
                        ${doc.title}
                      </h2>

                      <p class="font-sans text-stone-600 text-sm sm:text-base leading-relaxed font-normal">
                        ${doc.description}
                      </p>
                    </div>

                    <!-- Tags & External Link Action -->
                    <div class="pt-4 border-t border-stone-100 space-y-5">
                      ${tagsHtml ? `<div class="flex flex-wrap gap-2">${tagsHtml}</div>` : ""}

                      <div class="pt-2">
                        <a
                          href="${doc.googleDriveUrl}"
                          target="_blank"
                          rel="noopener noreferrer"
                          onclick="
                            gtag('event', 'select_content', {
                              send_to: 'G-R06ZC07TJE',
                              content_type: 'document',
                              item_id: '${doc.id}',
                            })
                          "
                          class="inline-flex items-center justify-between w-full px-5 py-3.5 bg-stone-900 hover:bg-stone-800 text-white text-xs font-semibold rounded-2xl transition-all shadow-sm hover:shadow group/btn"
                        >
                          <span class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            ${doc.actionLabel || "Read Reflection ↗"}
                          </span>
                          <span class="text-[11px] font-normal text-stone-400 group-hover/btn:text-stone-300">
                            Google Drive
                          </span>
                        </a>
                      </div>
                    </div>

                  </div>
                </article>
              `;
          })
          .join("");
      }

      renderFilters();
      renderCards();
    })();
  </script>
